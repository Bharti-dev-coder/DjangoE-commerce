{% extends "app.html" %}

{% block title %}Employee registration | EuphoriaDJ{% endblock %}

{% block content %}
<section class="page-banner">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb breadcrumb-light mb-3">
                <li class="breadcrumb-item"><a href="{% url 'home_page' %}">Home</a></li>
                <li class="breadcrumb-item"><a href="{% url 'get_all_employees' %}">Employees</a></li>
                <li class="breadcrumb-item active text-white" aria-current="page">Register</li>
            </ol>
        </nav>
        <h1 class="mb-2">Employee registration</h1>
        <p class="mb-0 text-white-50">Add an employee record to the existing directory.</p>
    </div>
</section>

<section class="container py-5">
    <div class="row justify-content-center py-3">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h2 class="h4 mb-0">New employee</h2>
                        <a href="{% url 'get_all_employees' %}" class="btn btn-sm btn-outline-primary rounded-pill">View directory</a>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="emp_name" class="form-label">Employee name</label>
                                <input type="text" name="emp_name" id="emp_name" class="form-control" maxlength="150" required>
                            </div>
                            <div class="col-md-6">
                                <label for="emp_email" class="form-label">Email</label>
                                <input type="email" name="emp_email" id="emp_email" class="form-control" maxlength="250" required>
                            </div>
                            <div class="col-md-6">
                                <label for="emp_mobile" class="form-label">Mobile number</label>
                                <input type="tel" name="emp_mobile" id="emp_mobile" class="form-control" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile number">
                            </div>
                            <div class="col-md-6">
                                <label for="emp_dept" class="form-label">Department</label>
                                <select name="emp_dept" id="emp_dept" class="form-select" required>
                                    <option value="it">Information Technology</option>
                                    <option value="sales" selected>Sales Representative</option>
                                    <option value="admin">Administrator</option>
                                    <option value="marketing">Digital Marketing</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="emp_dob" class="form-label">Date of birth</label>
                                <input type="date" name="emp_dob" id="emp_dob" class="form-control">
                            </div>
                            <div class="col-12">
                                <label for="emp_address" class="form-label">Address</label>
                                <textarea name="emp_address" id="emp_address" class="form-control" rows="4" placeholder="Enter address"></textarea>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Register employee</button>
                            <a href="{% url 'home_page' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
